name: Comprobar fuentes oficiales
on:
  workflow_dispatch:
permissions: {}
jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Consultas públicas acotadas
        shell: python
        run: |
          import hashlib, json, time, urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          targets = [
              ('MA_index_20261022', 'https://www.bopmalaga.es/?fecha=22-10-2026'),
              ('CU_index_20261022', 'https://www.dipucuenca.es/boletin1?p_p_id=as_asac_asset_search_AssetSearchInstancePortlet_INSTANCE_4WltI3x65yUH&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&p_r_p_endDate=22%2F10%2F2026&p_r_p_startDate=22%2F10%2F2026'),
              ('BU_index_20261022', 'https://bopbur.diputaciondeburgos.es/hemeroteca/2026-10-22'),
              ('BU_pdf_20261020', 'https://bopbur.diputaciondeburgos.es/sites/default/files/private/publicado/bopbur-2026-199/bopbur-2026-199-anuncio-202604424.pdf'),
          ]
          blocked = set()
          for name, url in targets:
              host = urllib.parse.urlsplit(url).hostname
              if host in blocked:
                  print(json.dumps({'id': name, 'skipped': 'previous_rate_limit'}))
                  continue
              report = {'id': name}
              started = time.monotonic()
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'EncuentraMusico-BulletinConnectivityTest/1.0', 'Accept-Encoding': 'identity'})
                  try:
                      response = opener.open(req, timeout=20)
                  except urllib.error.HTTPError as error:
                      response = error
                  with response:
                      report['status'] = response.status
                      if response.status == 429 or response.headers.get('Retry-After'):
                          blocked.add(host)
                      digest = hashlib.sha256()
                      size = 0
                      sample = b''
                      while True:
                          if time.monotonic() - started > 45:
                              raise TimeoutError()
                          chunk = response.read(65536)
                          if not chunk:
                              break
                          size += len(chunk)
                          if size > 12 * 1024 * 1024:
                              raise ValueError('size_limit')
                          digest.update(chunk)
                          sample = (sample + chunk)[:131072]
                      report.update(bytes=size, sha256=digest.hexdigest(), pdf=sample.startswith(b'%PDF-'))
                      lower = sample.lower()
                      report['blocked_page'] = any(x in lower for x in [b'request rejected', b'cf-chl-', b'captcha', b'access denied'])
                      report['ma_announcements'] = b'edicto.php' in lower
                      if name == 'BU_pdf_20261020':
                          report['matches_original'] = size == 6539352 and digest.hexdigest() == '038c2e8baa5e4a8ccfdcd4527182edf9d9ca4ab7601b8b527f63c2950a43d4bb'
              except Exception as error:
                  report['error_class'] = type(error).__name__
              report['elapsed_ms'] = round((time.monotonic() - started) * 1000)
              print(json.dumps(report), flush=True)
              time.sleep(1)
